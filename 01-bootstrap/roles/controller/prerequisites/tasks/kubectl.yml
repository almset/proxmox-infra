---
- name: Check current kubectl version
  ansible.builtin.command: kubectl version --client=true -o json
  register: kubectl_version_check
  changed_when: false
  failed_when: false

- name: Set fact if kubectl needs update
  ansible.builtin.set_fact:
    kubectl_installed: >-
      {{
        kubectl_version_check.rc == 0 and
        (kubectl_version_check.stdout | from_json).clientVersion.gitVersion == kubectl_version
      }}

- name: Download kubectl binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    owner: root
    group: root
  when: not kubectl_installed | bool
