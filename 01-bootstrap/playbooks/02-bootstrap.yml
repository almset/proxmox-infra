---
- name: Bootstrap GitOps Engine
  hosts: k8s_control_plane
  become: true
  
  module_defaults:
    kubernetes.core.k8s:
#      kubeconfig: "{{ kubernetes.kubeconfig }}"
      kubeconfig: "{{ kubeconfig }}"
      wait: true
      wait_timeout: 300s
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig }}"
      wait: true
      wait_timeout: 300s

  roles:
    - role: platform/gitops_engine
