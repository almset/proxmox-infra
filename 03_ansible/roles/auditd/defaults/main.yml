---
# ============================================================
# Role: auditd
# File: defaults/main.yml
# ============================================================

# Enable/disable the role entirely
auditd_enabled: true

# Show extra output during validate phase
auditd_debug: false

# Make audit rules immutable after loading.
# WARNING: when true, rules cannot be changed without a reboot.
# Subsequent Ansible runs will fail if rules differ.
auditd_immutable: false

# Packages per OS family
auditd_packages_map:
  Debian:
    - auditd
    - audispd-plugins
  RedHat:
    - audit
    - audispd-plugins

# /etc/audit/auditd.conf parameters
auditd_conf:
  log_file: /var/log/audit/audit.log
  log_format: RAW
  log_group: root
  priority_boost: 4
  flush: INCREMENTAL_ASYNC
  freq: 50
  num_logs: 10
  disp_qos: lossy
  name_format: HOSTNAME
  max_log_file: 8
  max_log_file_action: ROTATE
  space_left: 75
  space_left_action: SYSLOG
  action_mail_acct: root
  admin_space_left: 50
  admin_space_left_action: SUSPEND
  disk_full_action: SUSPEND
  disk_error_action: SUSPEND
  tcp_listen_queue: 5
  tcp_max_per_addr: 1
  tcp_client_max_idle: 0
  enable_krb5: "no"
  krb5_principal: auditd
  distribute_network: "no"

# Audit rule files to deploy via template
auditd_rules:
  - src: 10-base.rules.j2
    dest: 10-base.rules
    owner: root
    group: root
    mode: "0640"
