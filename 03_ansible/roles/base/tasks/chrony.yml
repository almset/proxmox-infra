---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Configure chrony servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart chrony

- name: Ensure chrony is started and enabled
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: yes
