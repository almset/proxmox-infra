---
# ==============================================================================
# Unattended Upgrades Management
# ==============================================================================

- name: Configure APT periodic updates
  ansible.builtin.template:
    src: apt/20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  when: base_manage_unattended_upgrades | bool

- name: Ensure unattended-upgrades service is in correct state
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: "{{ 'started' if base_unattended_upgrades_enabled | bool else 'stopped' }}"
    enabled: "{{ base_unattended_upgrades_enabled | bool }}"
  # Игнорируем ошибки, если пакет unattended-upgrades не установлен в минимальном образе
  failed_when: false
  when: base_manage_unattended_upgrades | bool

- name: Manage apt-daily timers based on unattended-upgrades state
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'started' if base_unattended_upgrades_enabled | bool else 'stopped' }}"
    enabled: "{{ base_unattended_upgrades_enabled | bool }}"
    masked: "{{ not (base_unattended_upgrades_enabled | bool) }}"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false
  when: base_manage_unattended_upgrades | bool
