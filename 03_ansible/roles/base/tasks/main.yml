---
- name: Check supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version('22.04', '>=')
    fail_msg: "CRITICAL: This role only supports Ubuntu 22.04 or newer. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
    success_msg: "OS check passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"
  tags: ['always']

- name: show host information
  ansible.builtin.import_tasks: facts.yml
  tags: ['always', 'facts']

- name: Manage unattended-upgrades configuration
  ansible.builtin.import_tasks: unattended-upgrades.yml 
  tags: ['always', 'unattended-upgrades']

- name: Install base packages
  ansible.builtin.import_tasks: packages.yml
  when: base_packages_enabled | bool
  tags: ['packages']

- name: Verify target user exists
  ansible.builtin.import_tasks: users.yml
  tags: ['bootstrap', 'users']

- name: Configure locale
  ansible.builtin.import_tasks: locale.yml
  tags: ['config', 'locale']

- name: Configure timezone
  ansible.builtin.import_tasks: timezone.yml
  tags: ['config', 'time']

- name: Configure chrony
  ansible.builtin.import_tasks: chrony.yml
  when: base_chrony_enabled | bool
  tags: ['config', 'time']

- name: Configure qemu-guest-agent
  ansible.builtin.import_tasks: qemu.yml
  when: base_qemu_enabled | bool
  tags: ['config', 'qemu']

- name: Apply sysctl settings
  ansible.builtin.import_tasks: sysctl.yml
  when: base_sysctl_enabled | bool
  tags: ['config', 'sysctl']

- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  when: base_preflight_enabled | bool
  tags: ['preflight']

- name: Configure MOTD
  ansible.builtin.import_tasks: motd.yml
  when: base_motd_enabled | bool
  tags: ['config', 'motd']
