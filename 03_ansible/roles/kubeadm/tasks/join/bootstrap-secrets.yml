---
- name: Compute CA cert hash locally (only if not explicitly provided)
  ansible.builtin.shell: >
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
    openssl rsa -pubin -outform der 2>/dev/null |
    openssl dgst -sha256 -hex
  args:
    executable: /bin/bash
  register: _ca_hash_cmd
  changed_when: false
  delegate_to: "{{ _cp_host }}"
  failed_when:
    - _ca_hash_cmd.rc != 0
    - _ca_hash_cmd.stdout is not search('[a-f0-9]{64}')
  when:
    - not _kubelet_conf_stat.stat.exists
    - kubeadm_ca_cert_hash | length == 0

- name: Generate unique join token for THIS node (on-demand, race-condition free)
  ansible.builtin.command: >-
    kubeadm token create --ttl {{ kubeadm_join_token_ttl }}
  delegate_to: "{{ _cp_host }}"
  register: _node_token
  changed_when: true
  failed_when:
    - _node_token.rc != 0
    - _node_token.stdout | trim | length == 0
  when: not _kubelet_conf_stat.stat.exists
