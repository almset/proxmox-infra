---
- name: Manage kubeconfig export (run_once — only one control-plane needs to export)
  block:
    - name: Ensure ~/.kube directory exists on controller
      ansible.builtin.file:
        path: "{{ kubeadm_kubeconfig_dest | dirname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Create temporary file for kubeconfig modification
      ansible.builtin.tempfile:
        state: file
        suffix: .yaml
      register: _kubeconfig_temp

    - name: Copy admin.conf to temp location
      ansible.builtin.copy:
        src: "{{ kubeadm_kubeconfig_path }}"
        dest: "{{ _kubeconfig_temp.path }}"
        mode: '0600'
        remote_src: true

    - name: Update cluster server address using official kubectl command
      ansible.builtin.command: >-
        kubectl config set-cluster kubernetes
        --server=https://{{ kubeadm_resolved_api_endpoint }}:6443
        --kubeconfig={{ _kubeconfig_temp.path }}
      environment:
        KUBECONFIG: "{{ _kubeconfig_temp.path }}"
      changed_when: true

    - name: Fetch modified kubeconfig to Ansible controller
      ansible.builtin.slurp:
        src: "{{ _kubeconfig_temp.path }}"
      register: _kubeconfig_modified

    - name: Deploy kubeconfig to Ansible controller
      ansible.builtin.copy:
        content: "{{ _kubeconfig_modified.content | b64decode }}"
        dest: "{{ kubeadm_kubeconfig_dest }}"
        mode: '0600'
      delegate_to: localhost
      become: false

  always:
    - name: Clean up temp kubeconfig on target node
      ansible.builtin.file:
        path: "{{ _kubeconfig_temp.path | default('') }}"
        state: absent
      when: _kubeconfig_temp is defined

  run_once: true
  when: kubeadm_kubeconfig_export_mode == 'controller'
