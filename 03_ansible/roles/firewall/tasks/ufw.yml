---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Reset UFW to defaults (idempotent)
  community.general.ufw:
    state: reset
  when: firewall_ufw_reset | default(false) | bool

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_ufw_default_input }}"

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_ufw_default_output }}"

- name: Set UFW default forwarding policy
  community.general.ufw:
    direction: routed
    policy: "{{ firewall_ufw_default_forward }}"
  when: firewall_ufw_default_forward is defined

- name: Set UFW logging
  community.general.ufw:
    logging: "{{ firewall_ufw_logging }}"

- name: Allow SSH via UFW
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ufw_ssh_port | string }}"
    proto: tcp
    comment: "SSH access"
  when: firewall_ufw_ssh_enabled | bool

- name: Apply extra UFW rules (port-based)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('Ansible managed') }}"
  loop: "{{ firewall_rules }}"
  when:
    - firewall_rules | default([]) | length > 0
    - item.port is defined
    - item.from_ip is not defined

- name: Apply extra UFW rules (IP-based)
  community.general.ufw:
    rule: "{{ item.rule }}"
    from_ip: "{{ item.from_ip }}"
    to_port: "{{ item.to_port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('Ansible managed') }}"
  loop: "{{ firewall_rules }}"
  when:
    - firewall_rules | default([]) | length > 0
    - item.from_ip is defined

- name: Enable UFW
  community.general.ufw:
    state: enabled
  async: 60       # Максимальное время выполнения 30 сек
  poll: 5         # Проверять статус каждые 5 сек
