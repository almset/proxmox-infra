---
# ==============================================================================
# Kernel Modules — загрузка и персистентность
# ==============================================================================
- name: Ensure /etc/modules-load.d directory exists
  ansible.builtin.file:
    path: /etc/modules-load.d
    state: directory
    mode: '0755'

- name: Deploy kernel modules configuration for RKE2
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - rke2 role
      overlay
      br_netfilter
    dest: /etc/modules-load.d/rke2.conf
    mode: '0644'
    owner: root
    group: root

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Verify kernel modules are loaded
  ansible.builtin.stat:
    path: "/sys/module/{{ item }}"
  register: _mod_check
  loop:
    - overlay
    - br_netfilter
  failed_when: not _mod_check.results[0].stat.exists or not _mod_check.results[1].stat.exists
  when: false  # Отключаем, так как modprobe выше уже гарантирует загрузку

# ==============================================================================
# Sysctl parameters — настройка сетевых параметров
# ==============================================================================
- name: Deploy RKE2 sysctl configuration
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - rke2 role
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      kernel.panic			  = 10
      kernel.panic_on_oops		  = 1
      vm.overcommit_memory		  = 1
    dest: /etc/sysctl.d/95-rke2.conf
    mode: '0644'
    owner: root
    group: root

- name: Apply sysctl parameters
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Verify sysctl parameters are applied
  ansible.builtin.command:
    cmd: "sysctl -n {{ item }}"
  register: _sysctl_check
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
  changed_when: false
  failed_when: _sysctl_check.stdout | trim != '1'
  when: not ansible_check_mode

- name: Check required kernel modules (overlay)
  ansible.builtin.stat:
    path: /sys/module/overlay
  register: _mod_overlay
  failed_when: not _mod_overlay.stat.exists
  when: not ansible_check_mode

- name: Check required kernel modules (br_netfilter)
  ansible.builtin.stat:
    path: /sys/module/br_netfilter
  register: _mod_br_netfilter
  failed_when: not _mod_br_netfilter.stat.exists
  when: not ansible_check_mode

- name: Check sysctl net.ipv4.ip_forward
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: _sysctl_ip_forward
  changed_when: false
  failed_when: _sysctl_ip_forward.stdout | trim != '1'
  when: not ansible_check_mode

- name: Check sysctl net.bridge.bridge-nf-call-iptables
  ansible.builtin.command:
    cmd: sysctl -n net.bridge.bridge-nf-call-iptables
  register: _sysctl_bridge
  changed_when: false
  failed_when: _sysctl_bridge.stdout | trim != '1'
  when: not ansible_check_mode
