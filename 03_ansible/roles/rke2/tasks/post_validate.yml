---
- name: Post-installation validation
  block:
    - name: Verify control plane health (readyz)
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl_cmd }} get --raw='/readyz'"
      register: _readyz
      changed_when: false
      failed_when: "'ok' not in _readyz.stdout"

    - name: Verify no nodes are in NotReady state
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl_cmd }} get nodes --no-headers"
      register: _nodes_status
      changed_when: false
      failed_when: "'NotReady' in _nodes_status.stdout"

    - name: Wait for core system components to be ready
      ansible.builtin.command:
        cmd: >-
          {{ rke2_kubectl_cmd }}
          wait --for=condition=Ready pods -n kube-system
          -l 'k8s-app in (kube-dns, metrics-server, calico-node)'
          --timeout=120s
      register: _system_pods_ready
      changed_when: false
      failed_when: _system_pods_ready.rc != 0

  when: 
    - not ansible_check_mode
    - rke2_is_server | bool  # <--- КЛЮЧЕВОЕ ДОБАВЛЕНИЕ: выполняем только на серверах
