---
- name: Ensure local kubeconfig exists on the node
  ansible.builtin.stat:
    path: "{{ rke2_kubeconfig_path }}"
  register: _local_kubeconfig
  failed_when: not _local_kubeconfig.stat.exists
  when: rke2_is_server | bool  # <-- ДОБАВЛЕНО: только для серверов

- name: Fetch kubeconfig to Ansible controller (ONLY if explicitly requested)
  ansible.builtin.slurp:
    src: "{{ rke2_kubeconfig_path }}"
  register: _rke2_kubeconfig_raw
  when: 
    - rke2_is_server | bool    # <-- ДОБАВЛЕНО
    - rke2_kubeconfig_export_mode == 'controller'

- name: Ensure ~/.kube directory exists on controller
  ansible.builtin.file:
    path: "{{ rke2_kubeconfig_dest | dirname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  when: 
    - rke2_is_server | bool    # <-- ДОБАВЛЕНО
    - rke2_kubeconfig_export_mode == 'controller'

- name: Deploy kubeconfig to Ansible controller with resolved API endpoint
  ansible.builtin.copy:
    content: >-
      {{ 
        _rke2_kubeconfig_raw.content | b64decode | 
        regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' + rke2_resolved_api_endpoint + ':6443') 
      }}
    dest: "{{ rke2_kubeconfig_dest }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  when: 
    - rke2_is_server | bool    # <-- ДОБАВЛЕНО
    - rke2_kubeconfig_export_mode == 'controller'

