---
- name: Check supported OS and versions
  ansible.builtin.assert:
    that:
      - (ansible_distribution == "Ubuntu" and ansible_distribution_major_version | int >= 22) or
        (ansible_distribution == "Debian" and ansible_distribution_major_version | int >= 11)
    fail_msg: >-
      CRITICAL: Unsupported OS. Requires Ubuntu >= 22.04 or Debian >= 11.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}
    success_msg: "OS check passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Check that required network interfaces exist
  ansible.builtin.command:
    cmd: "ip link show {{ item }}"
  loop:
    - "{{ gateway_external_interface }}"
    - "{{ gateway_internal_interface }}"
  loop_control:
    label: "{{ item }}"
  register: gateway_iface_check
  changed_when: false
  failed_when: gateway_iface_check.rc != 0

- name: Validate internal network CIDR format
  ansible.builtin.assert:
    that:
      - gateway_internal_network | ansible.utils.ipaddr('network')
    fail_msg: >-
      gateway_internal_network must be a valid CIDR (e.g., 192.168.100.0/24).
      Got: {{ gateway_internal_network }}
    success_msg: "Internal network validated: {{ gateway_internal_network }}"
