apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xwebapplications.platform.company.io
spec:
  group: platform.company.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                domain:
                  type: string
                replicas:
                  type: integer
                  default: 2
  scope: Cluster
  names:
    plural: xwebapplications
    singular: xwebapplication
    kind: XWebApplication
