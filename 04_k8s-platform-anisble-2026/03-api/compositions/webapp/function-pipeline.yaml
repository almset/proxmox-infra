apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webapp.standard.platform.company.io
  annotations:
    # АРХИТЕКТУРНЫЙ ПРИНЦИП:
    # Composition Functions — предпочтительный механизм генерации ресурсов.
    # Собственный Go-контроллер является строгим исключением и создается только 
    # при наличии сложной, недекларативной бизнес-логики.
spec:
  compositeTypeRef:
    apiVersion: platform.company.io/v1alpha1
    kind: XWebApplication
  mode: Pipeline # Современный режим Crossplane
  pipeline:
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $.observed.composite.resource.metadata.name }}-app
            spec:
              replicas: {{ $.observed.composite.resource.spec.replicas }}
              selector:
                matchLabels:
                  app: {{ $.observed.composite.resource.metadata.name }}
              template:
                metadata:
                  labels:
                    app: {{ $.observed.composite.resource.metadata.name }}
                spec:
                  containers:
                    - name: app
                      image: {{ $.observed.composite.resource.spec.image }}
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $.observed.composite.resource.metadata.name }}-route
            spec:
              parentRefs:
                - name: platform-gateway
                  namespace: gateway-system
              hostnames:
                - "{{ $.observed.composite.resource.spec.domain }}"
              rules:
                - backendRefs:
                    - name: {{ $.observed.composite.resource.metadata.name }}-app
                      port: 80
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
