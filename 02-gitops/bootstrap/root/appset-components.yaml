apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: gitops-system
spec:
  generators:
    - git:
        repoURL: https://github.com/almset/k8s-platform-2026.git
        revision: master
        directories:
          - path: 02-gitops/components/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/almset/k8s-platform-2026.git
        targetRevision: master
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
